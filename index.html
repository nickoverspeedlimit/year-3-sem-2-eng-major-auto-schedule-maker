<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--bd:#d0d0d0;--mut:#666;--hd:#f0f0f0;--bad:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--bd:#444;--mut:#999;--hd:#262626;--bad:#ef5350}}
body{font-family:system-ui,"Noto Sans Thai",sans-serif;margin:0;padding:12px;background:var(--bg);color:var(--fg)}
nav{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
button{font:inherit;padding:6px 14px;border:1px solid var(--bd);background:var(--hd);color:var(--fg);border-radius:6px;cursor:pointer}
button.on{background:var(--fg);color:var(--bg)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid var(--bd);padding:5px 8px;text-align:left;font-size:14px}
th{background:var(--hd)}
tr.dis td{color:var(--mut)}
.bad{color:var(--bad);font-weight:600}
#tt td{text-align:center;min-width:90px;height:44px;font-size:12px}
#tt td.f{background:#cfe8ff;color:#0b2540}
#tt td.x{background:#ffcdd2;color:#4a0d0d}
.warn{border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:8px 12px;margin:0 0 10px;font-size:14px}
.ok{border:1px solid var(--bd);color:var(--mut);border-radius:6px;padding:8px 12px;margin:0 0 10px;font-size:14px}
.pic{display:block;max-width:100%;width:420px;margin:12px 0;border:1px solid var(--bd)}
input[type=checkbox]{width:22px;height:22px;cursor:pointer}
nav{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
#tt th:first-child{position:sticky;left:0;z-index:2}
#tt tbody th{background:var(--hd)}
@media(max-width:700px){
  body{padding:8px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));padding-bottom:max(8px,env(safe-area-inset-bottom))}
  nav button{flex:1 1 auto;min-height:44px}
  #v1 .wrap{overflow:visible}
  #v1 table,#v1 tbody{display:block}
  #v1 thead{display:none}
  #v1 tr{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px}
  #v1 td{display:block;border:0;padding:0;font-size:13px;flex:0 0 auto}
  #v1 td:empty{display:none}
  #v1 td:nth-child(1){margin-right:0}
  #v1 td:nth-child(1) input{width:28px;height:28px}
  #v1 td:nth-child(2){font-weight:600;font-size:14px;flex:1 0 calc(100% - 52px);min-width:0}
  #v1 td:nth-child(3){margin-left:40px}
  #v1 td:nth-child(8){flex:1 0 calc(100% - 40px);margin-left:40px;font-size:13px;min-width:0;overflow-wrap:anywhere}
  #v1 td:nth-child(n+3)::before{content:attr(data-label) ": ";color:var(--mut)}
  #v1 td:nth-child(8)::before{content:""}
  #tt td,#tt th{padding:4px 5px;font-size:11px}
  #tt td{min-width:64px;height:52px}
  #tt th{white-space:nowrap}
  .warn,.ok{font-size:13px}
}
.note{color:var(--mut);margin:6px 0;font-size:13px}
#msg{margin:8px 0;font-size:13px;color:var(--mut)}
</style>
</head>

</nav>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; }
      else f+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n') i++;
      row.push(f); f=''; rows.push(row); row=[];
    } else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
const toMin = s => { const m=/^(\d+):(\d+)/.exec(String(s).trim()); return m? +m[1]*60+ +m[2] : NaN; };

let header=[], subs=[], notes=[], days=[], slots=[], limit=0, limitLabel='';
let ticked = new Set();
const KEY='schedule_ticks_v1';

function load(sCsv, tCsv, fromSheet){
  const sr = parseCSV(sCsv);
  header = sr[0];
  subs=[]; notes=[]; limit=0; limitLabel='';
  for(let i=1;i<sr.length;i++){
    const r=sr[i];
    const a=(r[0]||'').trim().toUpperCase();
    if(a==='TRUE'||a==='FALSE'){
      const s={i:subs.length, tick:a==='TRUE', name:r[1], day:(r[2]||'').trim(), start:toMin(r[3]), end:toMin(r[4]),
               startTxt:r[3], endTxt:r[4], rem:r[5]||'', type:(r[6]||'').trim(), extra:r[7]||''};
      subs.push(s);
      const m=/(\d+)\s*\/\s*(\d+)/.exec(r[7]||'');
      if(m){ limit=+m[2]; limitLabel=(r[7]||'').split(':')[0]; }
    } else if(r.some(x=>x&&x.trim())){
      notes.push(r.filter(x=>x&&x.trim()).join(' '));
    }
  }
  const tr = parseCSV(tCsv).filter(r=>r.some(x=>x&&x.trim()));
  slots = tr[0].slice(1).filter(x=>x&&x.trim()).map(lbl=>{
    const [a,b]=lbl.split('-'); return {lbl, s:toMin(a), e:toMin(b)};
  });
  days = tr.slice(1).map(r=>r[0].trim());
  // initial ticks: from sheet, or from saved browser state
  let saved=null;
  if(!fromSheet){ try{ saved=JSON.parse(localStorage.getItem(KEY)); }catch(e){} }
  ticked = new Set();
  subs.forEach(s=>{ if(saved? saved.includes(s.name) : s.tick) ticked.add(s.i); });
}

const clash = (a,b) => a.day===b.day && a.start<b.end && a.end>b.start;
const clashWith = s => { for(const j of ticked){ if(j!==s.i && clash(s,subs[j])) return subs[j]; } return null; };

const ALT_GROUPS = [['412219','412220']]; // either/or courses (หรือ), act like sections
const codeOf = s => String(s.name).trim().split(/\s+/)[0];
const groupOf = s => { const c=codeOf(s); const g=ALT_GROUPS.find(a=>a.includes(c)); return g? g.join('/') : c; };
const sameCourse = s => { for(const j of ticked){ if(j!==s.i && groupOf(subs[j])===groupOf(s)) return subs[j]; } return null; };

function save(){ try{ localStorage.setItem(KEY, JSON.stringify([...ticked].map(i=>subs[i].name))); }catch(e){} }

function render1(){
  let h='<div class="wrap"><table><thead><tr>'+header.filter((x,i)=>i<8).map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>';
  let elecCount=0;
  for(const j of ticked) if(subs[j].type==='วิชาเลือก') elecCount++;
  subs.forEach((s,idx)=>{
    const on=ticked.has(s.i);
    const c = clashWith(s);
    const sc = !on && sameCourse(s);
    const blocked = !on && (c || sc);
    let status='';
    if(c) status = '<span class="bad">'+(on?'ชนกับ ':'ชน: ')+esc(c.name)+'</span>';
    else if(sc) status = '<span class="bad">เลือกได้เพียง 1 เซค/ตัวเลือก (เลือกแล้ว: '+esc(sc.name)+')</span>';
    if(s.extra && /\d+\s*\/\s*\d+/.test(s.extra)) status += (status?'<br>':'')+'<span class="'+(elecCount>limit?'bad':'')+'">'+esc(limitLabel)+': '+elecCount+' / '+limit+'</span>';
    const L=k=>esc(header[k]||'');
    h+='<tr class="'+(blocked?'dis':'')+'"><td><input type="checkbox" data-i="'+s.i+'" '+(on?'checked':'')+(blocked?' disabled':'')+'></td>'
      +'<td>'+esc(s.name)+'</td><td data-label="'+L(2)+'">'+esc(s.day)+'</td><td data-label="'+L(3)+'">'+esc(s.startTxt)+'</td><td data-label="'+L(4)+'">'+esc(s.endTxt)+'</td><td data-label="'+L(5)+'">'+esc(s.rem)+'</td><td data-label="'+L(6)+'">'+esc(s.type)+'</td><td data-label="'+L(7)+'">'+status+'</td></tr>';
  });
  h+='</tbody></table></div>'+notes.map(n=>'<div class="note">'+esc(n)+'</div>').join('');
  $('v1').innerHTML=h+'<img class="pic" alt="" src="'+PIC+'">';
}

function warnings(){
  const groups={};
  subs.filter(s=>s.type==='บังคับ').forEach(s=>{ (groups[groupOf(s)] ||= {all:[]}).all.push(s); });
  const missing=[], dup=[];
  for(const k in groups){
    const g=groups[k];
    const on=g.all.filter(s=>ticked.has(s.i));
    const titles=[]; const seen=new Set();
    g.all.forEach(s=>{ const c=codeOf(s); if(!seen.has(c)){ seen.add(c); titles.push(c+' '+s.name.replace(/^\S+\s+/,'').replace(/\s+Sect\s*\d+$/i,'')); } });
    const title=titles.join(' หรือ ');
    if(on.length===0) missing.push(title);
    else if(on.length>1) dup.push(title);
  }
  let h='';
  if(missing.length) h+='<div class="warn">⚠ คุณยังเลือกวิชาบังคับไม่ครบ ขาด '+missing.length+' วิชา:<br>'+missing.map(esc).join('<br>')+'</div>';
  if(dup.length) h+='<div class="warn">⚠ วิชาบังคับเลือกได้เพียง 1 เซค/ตัวเลือกเท่านั้น แต่คุณเลือกเกิน 1 ในวิชา:<br>'+dup.map(esc).join('<br>')+'</div>';
  if(!missing.length && !dup.length) h='<div class="ok">เลือกวิชาบังคับครบแล้ว</div>';
  return h;
}

function render2(){
  let h=warnings()+'<div class="wrap"><table id="tt"><thead><tr><th>วัน</th>'+slots.map(s=>'<th>'+esc(s.lbl)+'</th>').join('')+'</tr></thead><tbody>';
  const active=[...ticked].map(i=>subs[i]);
  for(const d of days){
    const mine=active.filter(s=>s.day===d);
    const cells=slots.map(sl=>mine.filter(s=>s.start<sl.e && s.end>sl.s));
    h+='<tr><th>'+esc(d)+'</th>';
    for(let k=0;k<cells.length;){
      const key=cells[k].map(s=>s.i).join();
      if(!key){ h+='<td></td>'; k++; continue; }
      let span=1; while(k+span<cells.length && cells[k+span].map(s=>s.i).join()===key) span++;
      h+='<td colspan="'+span+'" class="'+(cells[k].length>1?'x':'f')+'">'+cells[k].map(s=>esc(s.name)).join('<br>')+'</td>';
      k+=span;
    }
    h+='</tr>';
  }
  $('v2').innerHTML=h+'</tbody></table></div>';
}

function show(n){
  $('v1').hidden = n!==1; $('v2').hidden = n!==2;
  $('b1').className = n===1?'on':''; $('b2').className = n===2?'on':'';
  if(n===2) render2();
}

$('v1').addEventListener('change', e=>{
  const i=+e.target.dataset.i; if(isNaN(i)) return;
  if(e.target.checked){ if(clashWith(subs[i])||sameCourse(subs[i])){ e.target.checked=false; return; } ticked.add(i); }
  else ticked.delete(i);
  save(); render1();
});
$('b1').onclick=()=>show(1);
$('b2').onclick=()=>show(2);
$('rs').onclick=()=>{ ticked.clear(); save(); render1(); render2(); };
$('rf').onclick=()=>init(true);

async function init(fromSheet){
  let s=SNAP_SUBJECTS, t=SNAP_TABLE, src='ข้อมูลที่ฝังไว้ (snapshot)';
  if(URL_SUBJECTS && URL_TABLE){
    try{
      const [a,b]=await Promise.all([fetch(URL_SUBJECTS,{cache:'no-store'}),fetch(URL_TABLE,{cache:'no-store'})]);
      if(!a.ok||!b.ok) throw 0;
      s=await a.text(); t=await b.text(); src='Google Sheet';
    }catch(e){ src='โหลดชีตไม่ได้ ใช้ snapshot แทน'; }
  }
  load(s,t,fromSheet);
  $('msg').textContent='ที่มาข้อมูล: '+src;
  render1(); render2();
}
init(false);
</script>
